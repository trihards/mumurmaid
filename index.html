<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a14">
<meta name="color-scheme" content="dark">
<title>Murmurmaid</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/mermaid.webp">
<link rel="preload" as="image" href="assets/logo.webp">
<style>
  :root {
    --bg: #030a14;
    --panel: rgba(8, 22, 38, .62);
    --line: rgba(110, 170, 220, .16);
    --text: #a9c3d8;
    --dim: #6b88a0;
    --accent: #5cc8f2;
    --accent-dim: #1b4f74;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); }   /* no body background: it would paint over the .bg art layer */
  body {
    font: 15px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  main { position: relative; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; justify-content: center; }
  h1 { margin: 0; line-height: 0; }
  h1 img { width: min(240px, 64vw); height: auto; filter: drop-shadow(0 4px 18px rgba(0, 40, 90, .5)); }

  /* Brand art: full strength on the splash, then dimmed to a bedside-dark backdrop */
  .bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg);
  }
  .bg img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%;
    transform-origin: 50% 55%;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(3, 10, 20, .74) 0%, rgba(3, 10, 20, .86) 45%, rgba(3, 10, 20, .94) 100%);
    opacity: 0; transition: opacity 1.6s ease;
  }
  body.entered .bg::after { opacity: 1; }
  body.playing .bg img { animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: scale(1.07) translateY(-1.5%); } }

  main, footer { transition: opacity 1.2s ease .3s; }
  body:not(.entered) main { opacity: 0; pointer-events: none; }

  #splash {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: max(14vh, env(safe-area-inset-top)) 16px max(6vh, env(safe-area-inset-bottom));
    cursor: pointer; transition: opacity 1s ease;
  }
  #splash img { width: min(560px, 88vw); height: auto; filter: drop-shadow(0 6px 30px rgba(0, 30, 80, .55)); animation: rise 1.4s ease-out both; }
  #splash span { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: rgba(230, 245, 255, .92); padding: 10px 20px; border-radius: 999px; background: rgba(3, 18, 36, .45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: rise 1.4s ease-out .6s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  body.entered #splash { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    body.playing .bg img, #splash img, #splash span { animation: none; }
  }

  #play {
    align-self: center;
    width: 168px; height: 168px; border-radius: 50%;
    border: 1px solid var(--line);
    background: radial-gradient(circle at 50% 40%, rgba(16, 44, 72, .85), rgba(4, 12, 24, .9) 70%);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: var(--accent);
    display: grid; place-items: center; cursor: pointer;
    transition: box-shadow .6s ease, border-color .6s ease;
  }
  #play svg { width: 56px; height: 56px; }
  #play.on { border-color: var(--accent-dim); box-shadow: 0 0 60px -10px #1b6fa0; animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 80px -6px #1b6fa0; } }
  @media (prefers-reduced-motion: reduce) { #play.on { animation: none; } }

  section h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font: inherit; font-size: 14px; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .chip.active { border-color: var(--accent); color: var(--accent); }
  .chip .x { color: var(--dim); font-size: 16px; line-height: 1; padding-left: 2px; }
  .empty { font-size: 13px; color: var(--dim); }

  .slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-bottom: 18px; }
  .slider label { font-size: 14px; }
  .slider output { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] {
    grid-column: 1 / -1; width: 100%; margin: 6px 0 0;
    -webkit-appearance: none; appearance: none; background: transparent; height: 28px;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px;
    border-radius: 50%; background: var(--accent); border: 4px solid var(--bg);
  }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 4px solid var(--bg); }

  form { display: flex; gap: 8px; }
  form input {
    flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit;
  }
  form input::placeholder { color: var(--dim); }
  form button {
    padding: 10px 18px; border-radius: 999px; border: 1px solid var(--accent-dim);
    background: transparent; color: var(--accent); font: inherit; cursor: pointer;
  }
  footer { font-size: 12px; color: var(--dim); text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><img src="assets/mermaid.webp" alt=""></div>
<div id="splash" role="button" aria-label="Enter Murmurmaid">
  <img src="assets/logo.webp" alt="Murmurmaid">
  <span>Tap to dive in</span>
</div>
<main>
  <header>
    <h1><img src="assets/logo.webp" alt="Murmurmaid"></h1>
  </header>

  <button id="play" aria-label="Play">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="icon" d="M8 5v14l11-7z"/></svg>
  </button>

  <section>
    <h2>Presets</h2>
    <div class="chips" id="presets"></div>
  </section>

  <section>
    <h2>Shape</h2>
    <div class="slider">
      <label for="color">Color</label><output id="color-out"></output>
      <input id="color" type="range" min="0" max="100">
    </div>
    <div class="slider">
      <label for="pitch">Pitch</label><output id="pitch-out"></output>
      <input id="pitch" type="range" min="0" max="100">
    </div>
    <div class="slider">
      <label for="drops">Drops</label><output id="drops-out"></output>
      <input id="drops" type="range" min="0" max="100">
    </div>
    <div class="slider">
      <label for="depth">Waves</label><output id="depth-out"></output>
      <input id="depth" type="range" min="0" max="100">
    </div>
    <div class="slider">
      <label for="speed">Speed</label><output id="speed-out"></output>
      <input id="speed" type="range" min="0" max="100">
    </div>
  </section>

  <section>
    <h2>My sounds</h2>
    <div class="chips" id="saved"></div>
    <form id="save-form" style="margin-top:12px">
      <input id="save-name" placeholder="Name this sound" maxlength="24" autocomplete="off">
      <button type="submit">Save</button>
    </form>
  </section>

  <footer>Use your phone's volume buttons. Keeps playing when locked.<br>Controls also appear on the lock screen.</footer>
</main>

<script>
(() => {
  const STORE_KEY = 'mumurmaid.v1';

  const PRESETS = [
    { name: 'White',    color: 0,   pitch: 100, drops: 0,  depth: 0,  speed: 50 },
    { name: 'Pink',     color: 50,  pitch: 90,  drops: 0,  depth: 0,  speed: 50 },
    { name: 'Brown',    color: 100, pitch: 62,  drops: 0,  depth: 0,  speed: 50 },
    { name: 'Rain',     color: 45,  pitch: 62,  drops: 45, depth: 12, speed: 80 },
    { name: 'Leaves',   color: 70,  pitch: 45,  drops: 30, depth: 25, speed: 60 },
    { name: 'Downpour', color: 40,  pitch: 70,  drops: 90, depth: 15, speed: 85 },
    { name: 'Ocean',    color: 72,  pitch: 55,  drops: 0,  depth: 80, speed: 32 },
    { name: 'Fan',      color: 58,  pitch: 38,  drops: 0,  depth: 4,  speed: 95 },
    { name: 'Deep sea', color: 100, pitch: 22,  drops: 0,  depth: 55, speed: 12 },
  ];

  // Audio runs live through Web Audio: looped buffers are sample-accurate (no seam)
  // and every control is an AudioParam, so changes glide instead of reloading.
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC({ latencyHint: 'playback' });
  const SR = ctx.sampleRate;
  // Safari: treat this page as media playback (keeps going when locked, ignores the silent switch)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}

  // Slider value (0-100) -> physical parameter
  const cutoffHz  = p => Math.min(150 * Math.pow(11000 / 150, p / 100), SR * 0.45);
  const waveHz    = s => 0.03 * Math.pow(0.6 / 0.03, s / 100);
  const colorMix  = v => { const c = v / 100; return c < 0.5 ? [1 - c * 2, c * 2, 0] : [0, 2 - c * 2, c * 2 - 1]; };
  const HP_HZ = 25;
  const BROWN_HZ = SR * 0.0198 / (2 * Math.PI);   // corner of the brown integrator below

  // ---------- noise sources ----------

  // Fills `out` with a blend of white / pink / brown noise (weights m0..m2).
  // Everything is local variables in one loop: closures over mutable doubles
  // are several times slower in JS engines.
  function fillNoise(out, m0, m1, m2) {
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, brown = 0;
    let seed = (Math.random() * 0xffffffff) | 1;
    for (let i = 0, n = out.length; i < n; i++) {
      seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;   // xorshift32
      const w = seed / 2147483648;
      // Paul Kellet's pink filter
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362;
      b6 = w * 0.115926;
      brown = (brown + 0.02 * w) / 1.02;
      out[i] = w * m0 + pink * m1 + brown * m2;
    }
  }

  // In-place 1-pole highpass
  function highpass(buf, freq) {
    const a = Math.exp(-2 * Math.PI * freq / SR);
    let px = 0, py = 0;
    for (let i = 0, n = buf.length; i < n; i++) {
      const x = buf[i];
      py = a * (py + x - px); px = x;
      buf[i] = py;
    }
  }

  // A seamless, unit-RMS noise loop: the tail is folded into the head with an
  // equal-power crossfade so the wrap point is indistinguishable from the rest.
  function noiseLoop(seconds, weights) {
    const N = Math.round(SR * seconds), F = SR * 2;
    const raw = new Float32Array(N + F);
    fillNoise(raw, ...weights);
    highpass(raw, HP_HZ);
    for (let i = 0; i < F; i++) {
      const t = (i / F) * Math.PI / 2;
      raw[i] = raw[N + i] * Math.cos(t) + raw[i] * Math.sin(t);
    }
    let sum = 0;
    for (let i = F; i < N; i++) sum += raw[i] * raw[i];
    const k = 1 / Math.sqrt(sum / (N - F));
    const buf = ctx.createBuffer(1, N, SR);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < N; i++) ch[i] = raw[i] * k;
    return buf;
  }

  // Loudness compensation: estimate the output RMS of the colour blend through
  // the filters from their spectra, and return the gain that hits a fixed level.
  const SHAPES = [f => 1, f => 1 / f, f => 1 / (f * f + BROWN_HZ * BROWN_HZ)];
  function levelFor(s) {
    const fc = cutoffHz(s.pitch), nyq = SR / 2, mix = colorMix(s.color);
    let power = 0;
    mix.forEach((m, k) => {
      if (!m) return;
      let num = 0, den = 0;
      for (let i = 0; i < 240; i++) {
        const f = 5 * Math.pow(nyq / 5, i / 239);   // log grid, so df ∝ f
        const hp = (f / HP_HZ) ** 2 / (1 + (f / HP_HZ) ** 2);
        const lp = 1 / (1 + (f / fc) ** 4);           // one 2-pole Butterworth, |H|²
        const p = SHAPES[k](f) * hp * f;
        den += p; num += p * lp * lp;
      }
      power += m * m * num / den;
    });
    return 0.15 / Math.sqrt(power || 1e-9);
  }

  // ---------- rain drops ----------
  // Each drop is a short noise burst through a resonator (a leaf or surface being
  // struck), placed at a random time and stereo position. Heavier layers also get
  // the odd water "plink": a decaying sine whose pitch rises, like a bubble.
  // Events that run past the end wrap to the start, so each layer loops seamlessly.

  function dropLayer(seconds, rate, opts) {
    const N = Math.round(SR * seconds);
    const L = new Float32Array(N), R = new Float32Array(N);
    const count = Math.round(rate * seconds);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const add = (i, v, gl, gr) => { const j = i % N; L[j] += v * gl; R[j] += v * gr; };
    let seed = (Math.random() * 0xffffffff) | 1;

    for (let e = 0; e < count; e++) {
      const t0 = Math.floor(Math.random() * N);
      const amp = Math.exp(-rnd(0, opts.spread));           // many soft drops, few loud ones
      const th = (0.5 + (Math.random() - 0.5) * 0.9) * Math.PI / 2;
      const gl = Math.cos(th), gr = Math.sin(th);

      if (Math.random() < opts.plink) {
        const f0 = rnd(900, 2400), tau = rnd(0.008, 0.02) * SR, len = Math.round(tau * 5);
        let ph = 0;
        for (let i = 0; i < len; i++) {
          ph += 2 * Math.PI * f0 * (1 + 0.8 * i / len) / SR;
          const env = Math.exp(-i / tau) * Math.min(1, i / (SR * 0.0005));
          add(t0 + i, Math.sin(ph) * env * amp * 0.5, gl, gr);
        }
        continue;
      }

      const fc = Math.exp(rnd(Math.log(opts.fLo), Math.log(opts.fHi)));
      const bw = fc / rnd(2, 6);
      const r = Math.exp(-Math.PI * bw / SR), a1 = 2 * r * Math.cos(2 * Math.PI * fc / SR), a2 = r * r;
      const tau = rnd(opts.dLo, opts.dHi) * SR, len = Math.round(tau * 6), decay = Math.exp(-1 / tau);
      const gL = gl * amp * (1 - r), gR = gr * amp * (1 - r);
      let y1 = 0, y2 = 0, env = 1;
      for (let i = 0, j = t0; i < len; i++, j++) {
        if (j === N) j = 0;
        seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
        const y = (seed / 2147483648) * env + a1 * y1 - a2 * y2;
        y2 = y1; y1 = y; env *= decay;
        L[j] += y * gL; R[j] += y * gR;
      }
    }

    // Level by RMS, then round off the rare tall peaks with a soft clip. Drops are
    // spiky (peaks ~30x the average), so a plain peak cap would leave them inaudible.
    let sum = 0;
    for (let i = 0; i < N; i++) sum += L[i] * L[i] + R[i] * R[i];
    const k = opts.rms / Math.sqrt(sum / (2 * N) || 1), c = opts.peak;
    const buf = ctx.createBuffer(2, N, SR);
    const bl = buf.getChannelData(0), br = buf.getChannelData(1);
    for (let i = 0; i < N; i++) { bl[i] = c * Math.tanh(L[i] * k / c); br[i] = c * Math.tanh(R[i] * k / c); }
    return buf;
  }

  // Drops slider 0..100 fades these in one after another
  const DROP_LAYERS = [
    { secs: 29, rate: 7,   fLo: 500,  fHi: 2200, dLo: 0.004, dHi: 0.012, spread: 2.5, plink: 0.12, rms: 0.05,  peak: 0.38 },
    { secs: 17, rate: 45,  fLo: 1200, fHi: 4500, dLo: 0.002, dHi: 0.006, spread: 3,   plink: 0.02, rms: 0.06,  peak: 0.3 },
    { secs: 7,  rate: 300, fLo: 2500, fHi: 8000, dLo: 0.001, dHi: 0.003, spread: 3,   plink: 0,    rms: 0.05,  peak: 0.25 },
  ];
  const dropMix = v => DROP_LAYERS.map((_, i) => Math.max(0, Math.min(1, (v / 100) * 3 - i)));

  // ---------- graph ----------
  // [white|pink|brown] -> colour gains -> lowpass x2 -> level -> wave -> master -> out
  // [drop layers] -> drop gains ----------------------------------> wave (no pitch filter)
  // two LFOs push wave.gain around for the swell

  const BUTTERWORTH_Q_DB = -3.0103;   // Web Audio's lowpass Q is in dB; this is Q = 0.707
  const master = ctx.createGain(); master.gain.value = 0;
  master.connect(ctx.destination);
  const wave = ctx.createGain(); wave.connect(master);
  const level = ctx.createGain(); level.connect(wave);
  const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.Q.value = BUTTERWORTH_Q_DB; lp2.connect(level);
  const lp1 = ctx.createBiquadFilter(); lp1.type = 'lowpass'; lp1.Q.value = BUTTERWORTH_Q_DB; lp1.connect(lp2);

  // Loop lengths are coprime-ish so the three loops never line up audibly
  const colorGains = [[1, 0, 0, 31], [0, 1, 0, 37], [0, 0, 1, 41]].map(([a, b, c, secs]) => {
    const g = ctx.createGain(); g.gain.value = 0; g.connect(lp1);
    const src = ctx.createBufferSource();
    src.buffer = noiseLoop(secs, [a, b, c]);
    src.loop = true;
    src.connect(g);
    src.start(0, Math.random() * secs);
    return g;
  });

  const dropGains = DROP_LAYERS.map(o => {
    const g = ctx.createGain(); g.gain.value = 0; g.connect(wave);
    const src = ctx.createBufferSource();
    src.buffer = dropLayer(o.secs, o.rate, o);
    src.loop = true;
    src.connect(g);
    src.start(0, Math.random() * o.secs);
    return g;
  });

  // Main swell: a crest-shaped periodic wave, ((1 - cos) / 2)^1.5, built from its harmonics
  const CREST_MEAN = (() => {
    let m = 0; for (let j = 0; j < 1024; j++) m += Math.pow((1 - Math.cos(2 * Math.PI * j / 1024)) / 2, 1.5);
    return m / 1024;
  })();
  const crest = (() => {
    const H = 12, M = 1024, real = new Float32Array(H + 1), imag = new Float32Array(H + 1);
    for (let n = 1; n <= H; n++) {
      let a = 0;
      for (let j = 0; j < M; j++) {
        const ph = j / M;
        a += Math.pow((1 - Math.cos(2 * Math.PI * ph)) / 2, 1.5) * Math.cos(2 * Math.PI * n * ph);
      }
      real[n] = (2 * a) / M;
    }
    return ctx.createPeriodicWave(real, imag, { disableNormalization: true });
  })();
  const lfo1 = ctx.createOscillator(); lfo1.setPeriodicWave(crest);
  const lfo2 = ctx.createOscillator();   // slower-drifting sine so swells aren't metronomic
  const depth1 = ctx.createGain(), depth2 = ctx.createGain();
  depth1.gain.value = depth2.gain.value = 0;
  lfo1.connect(depth1).connect(wave.gain);
  lfo2.connect(depth2).connect(wave.gain);
  lfo1.start(); lfo2.start();

  // Push settings into the graph. `glide` smooths slider moves; 0 jumps.
  function applyToGraph(s, glide = 0.12) {
    const t = ctx.currentTime;
    const set = (param, v) => {
      param.cancelScheduledValues(t);
      if (glide) param.setTargetAtTime(v, t, glide); else param.setValueAtTime(v, t);
    };
    colorMix(s.color).forEach((m, k) => set(colorGains[k].gain, m));
    set(lp1.frequency, cutoffHz(s.pitch));
    set(lp2.frequency, cutoffHz(s.pitch));
    // envelope = (1 - d) + d * (0.75 * crest + 0.25 * (1 - cos) / 2), as base + LFO terms
    const d = s.depth / 100, hz = waveHz(s.speed);
    const base = 1 - d + d * (0.75 * CREST_MEAN + 0.25 * 0.5);
    // troughs make wavy sounds quieter on average; make up half of that (in dB) without clipping crests
    set(level.gain, levelFor(s) / Math.sqrt(base));
    set(wave.gain, base);
    set(depth1.gain, 0.75 * d);
    set(depth2.gain, 0.125 * d);
    set(lfo1.frequency, hz);
    set(lfo2.frequency, hz * 0.382);
    dropMix(s.drops).forEach((m, i) => set(dropGains[i].gain, m));
  }

  // ---------- state ----------

  const $ = id => document.getElementById(id);
  const sliders = ['color', 'pitch', 'drops', 'depth', 'speed'];
  const store = (() => {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  })();
  let settings = { color: 50, pitch: 90, drops: 0, depth: 0, speed: 50, ...(store.current || {}) };
  let saved = Array.isArray(store.saved) ? store.saved : [];
  let activeName = store.activeName ?? 'Pink';
  const keyOf = s => sliders.map(k => s[k] ?? 0).join(',');   // sounds saved before Drops existed count as 0

  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ current: settings, saved, activeName })); } catch {}
  }

  // ---------- play / pause ----------
  // A silent looping <audio> element runs alongside Web Audio. It's what the OS
  // sees as "media playing": it owns the lock-screen controls and keeps mobile
  // browsers from suspending the page. It's silent, so its own loop gap is inaudible.

  function silentWav() {
    const n = 8000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);   // 8-bit silence
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  const keepAlive = new Audio(silentWav());
  keepAlive.loop = true;
  keepAlive.setAttribute('playsinline', '');

  let playing = false, suspendTimer = null;

  function play() {
    if (playing) return;
    playing = true;
    clearTimeout(suspendTimer);
    keepAlive.play().catch(() => {});
    ctx.resume();
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(1, t + 1.5);   // gentle fade-in
    updatePlayUI();
  }

  function pause() {
    if (!playing) return;
    playing = false;
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(0, t + 0.4);
    suspendTimer = setTimeout(() => { if (!playing) ctx.suspend(); }, 500);
    keepAlive.pause();
    updatePlayUI();
  }

  // Headphones unplugged, a call came in, etc.: the OS pauses the media element
  keepAlive.addEventListener('pause', () => { if (playing) pause(); });

  // Phone calls / Siri can interrupt the context; pick back up afterwards
  const revive = () => { if (playing && ctx.state !== 'running') ctx.resume().catch(() => {}); };
  ctx.addEventListener('statechange', revive);
  document.addEventListener('visibilitychange', revive);

  // ---------- media session (lock screen) ----------

  const ms = 'mediaSession' in navigator ? navigator.mediaSession : null;
  const art = new URL('assets/artwork-512.jpg', location.href).href;
  function updateMediaSession() {
    if (!ms) return;
    ms.metadata = new MediaMetadata({
      title: activeName || 'Custom',
      artist: 'Murmurmaid',
      artwork: [{ src: art, sizes: '512x512', type: 'image/jpeg' }],
    });
    ms.playbackState = playing ? 'playing' : 'paused';
  }
  if (ms) {
    ms.setActionHandler('play', play);
    ms.setActionHandler('pause', pause);
    try { ms.setActionHandler('stop', pause); } catch {}
  }

  // ---------- UI ----------

  function updatePlayUI() {
    $('play').classList.toggle('on', playing);
    document.body.classList.toggle('playing', playing);
    $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
    $('icon').setAttribute('d', playing ? 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z' : 'M8 5v14l11-7z');
    updateMediaSession();
  }

  function describe() {
    const c = settings.color;
    $('color-out').textContent = c < 17 ? 'white' : c < 40 ? 'white-pink' : c < 60 ? 'pink' : c < 83 ? 'pink-brown' : 'brown';
    const hz = cutoffHz(settings.pitch);
    $('pitch-out').textContent = hz >= 1000 ? (hz / 1000).toFixed(1) + ' kHz' : Math.round(hz) + ' Hz';
    $('depth-out').textContent = settings.depth === 0 ? 'steady' : settings.depth + '%';
    const period = 1 / waveHz(settings.speed);
    $('speed-out').textContent = settings.depth === 0 ? '—' : 'every ' + (period < 10 ? period.toFixed(1) : Math.round(period)) + 's';
    $('speed').disabled = settings.depth === 0;
    $('speed').parentElement.style.opacity = settings.depth === 0 ? 0.4 : 1;
    const d = settings.drops;
    $('drops-out').textContent = d === 0 ? 'none' : d < 34 ? 'sparse' : d < 67 ? 'steady' : 'downpour';
  }

  function chip(label, active, onClick, onDelete) {
    const b = document.createElement('button');
    b.className = 'chip' + (active ? ' active' : '');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', onClick);
    if (onDelete) {
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Delete ' + label);
      x.addEventListener('click', e => { e.stopPropagation(); onDelete(); });
      b.append(x);
    }
    return b;
  }

  function renderChips() {
    const matches = p => keyOf(p) === keyOf(settings);
    const pr = $('presets'); pr.replaceChildren();
    PRESETS.forEach(p => pr.append(chip(p.name, matches(p) && activeName === p.name, () => apply(p))));
    const sv = $('saved'); sv.replaceChildren();
    if (!saved.length) {
      const e = document.createElement('span'); e.className = 'empty';
      e.textContent = 'Dial something in, then save it here.';
      sv.append(e);
    }
    saved.forEach((p, i) => sv.append(chip(p.name, matches(p) && activeName === p.name, () => apply(p), () => {
      saved.splice(i, 1); persist(); renderChips();
    })));
  }

  function syncSliders() { sliders.forEach(k => { $(k).value = settings[k]; }); describe(); }

  function apply(p) {
    sliders.forEach(k => { settings[k] = p[k] ?? 0; });
    activeName = p.name;
    syncSliders(); renderChips(); persist(); updateMediaSession();
    applyToGraph(settings, 0.4);   // presets crossfade a little slower
  }

  sliders.forEach(k => $(k).addEventListener('input', e => {
    settings[k] = +e.target.value;
    activeName = 'Custom';
    describe(); renderChips(); persist(); updateMediaSession();
    applyToGraph(settings);
  }));

  $('play').addEventListener('click', () => (playing ? pause() : play()));

  $('save-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('save-name').value.trim() || 'Sound ' + (saved.length + 1);
    const entry = { name };
    sliders.forEach(k => { entry[k] = settings[k]; });
    const existing = saved.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
    if (existing >= 0) saved[existing] = entry; else saved.push(entry);
    activeName = name;
    $('save-name').value = '';
    $('save-name').blur();
    persist(); renderChips(); updateMediaSession();
  });

  // Splash: brand art at full strength, then it dims into the backdrop (tap skips)
  const enter = () => document.body.classList.add('entered');
  $('splash').addEventListener('click', enter);
  setTimeout(enter, 2600);

  applyToGraph(settings, 0);
  ctx.suspend();
  syncSliders();
  renderChips();
  updatePlayUI();
})();
</script>
</body>
</html>
